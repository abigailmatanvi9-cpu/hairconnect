<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offres d’emploi — HairConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page hc-theme-pro">

<div class="login-container subpage-container subpage-wide jobs-page">
    <header class="login-header jobs-page__header">
        <a href="dashboard.html" class="login-back" aria-label="Retour">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
        </a>
        <h1 class="login-title">Offres d'Emploi</h1>
    </header>

    <div class="jobs-search">
        <span class="jobs-search__icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3.5-3.5"/></svg>
        </span>
        <input id="jobsSearchInput" class="jobs-search__input" type="search" placeholder="Rechercher emplois, salons..." autocomplete="off">
    </div>

    <div id="jobsTabs" class="jobs-tabs" role="tablist" aria-label="Filtrer les offres">
        <button class="jobs-tab is-active" type="button" data-filter="all" role="tab" aria-selected="true">Tous</button>
        <button class="jobs-tab" type="button" data-filter="full-time" role="tab" aria-selected="false">Temps Plein</button>
        <button class="jobs-tab" type="button" data-filter="part-time" role="tab" aria-selected="false">Temps Partiel</button>
        <button class="jobs-tab" type="button" data-filter="cdd" role="tab" aria-selected="false">CDD</button>
    </div>

    <section class="jobs-summary-card" aria-live="polite">
        <div class="jobs-summary-card__icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><rect width="20" height="14" x="2" y="7" rx="3"/><path d="M2 13h20"/></svg>
        </div>
        <div class="jobs-summary-card__text">
            <p id="jobsCountText" class="jobs-summary-card__title">0 Postes Disponibles</p>
            <p class="jobs-summary-card__subtitle">Trouvez votre match parfait</p>
        </div>
    </section>

    <p id="err" class="form-error" role="alert" hidden></p>
    <ul id="offresList" class="jobs-list"></ul>

    <section id="salonFormSection" class="offre-create jobs-create" hidden>
        <h2 class="subpage-h2">Publier une offre</h2>
        <form id="offreForm" class="register-form">
            <p id="fe" class="form-error" role="alert" hidden></p>
            <p id="fo" class="form-success" role="status" hidden></p>
            <div class="field-group">
                <label class="field-label" for="title">Titre du poste</label>
                <div class="field-input-wrap">
                    <input type="text" id="title" required placeholder="Ex. Coiffeur(se) mi-temps">
                </div>
            </div>
            <div class="field-group">
                <label class="field-label" for="offreCity">Ville</label>
                <div class="field-input-wrap">
                    <select id="offreCity" class="field-select" required aria-describedby="offreLocationHint"></select>
                </div>
            </div>
            <div class="field-group" id="offreCityOtherWrap" hidden>
                <label class="field-label" for="offreCityOther">Autre ville</label>
                <div class="field-input-wrap">
                    <input type="text" id="offreCityOther" placeholder="Nom de la ville">
                </div>
            </div>
            <div class="field-group">
                <label class="field-label" for="offreQuartier">Quartier</label>
                <div class="field-input-wrap">
                    <select id="offreQuartier" class="field-select" required disabled></select>
                </div>
                <p class="field-hint" id="offreLocationHint">Même sélection que dans Mon profil : ville puis quartier.</p>
            </div>
            <div class="field-group" id="offreQuartierOtherWrap" hidden>
                <label class="field-label" for="offreQuartierOther">Autre quartier</label>
                <div class="field-input-wrap">
                    <input type="text" id="offreQuartierOther" placeholder="Ex. Tokoin, Bè…">
                </div>
            </div>
            <div class="field-group">
                <label class="field-label" for="remunerationType">Rémunération</label>
                <div class="field-input-wrap">
                    <select id="remunerationType" class="field-select" required>
                        <option value="">Choisir…</option>
                        <option value="monthly">Salaire mensuel fixe</option>
                        <option value="per_prestation">Paiement à chaque prestation</option>
                    </select>
                </div>
            </div>
            <div class="field-group" id="salaryMonthlyWrap" hidden>
                <label class="field-label" for="salaryFcfa">Salaire mensuel (FCFA)</label>
                <div class="field-input-wrap">
                    <input type="number" id="salaryFcfa" min="1" step="1" inputmode="numeric" placeholder="Ex. 120000">
                </div>
            </div>
            <div class="field-group" id="remunerationNoteWrap" hidden>
                <label class="field-label" for="remunerationNote">Précisions sur la rémunération</label>
                <textarea id="remunerationNote" class="field-textarea" rows="2" placeholder="Ex. commission 40 % par prestation, pourboires…"></textarea>
            </div>
            <div class="field-group">
                <label class="field-label" for="contractType">Type de contrat</label>
                <div class="field-input-wrap">
                    <select id="contractType" class="field-select" required>
                        <option value="full-time">Temps plein</option>
                        <option value="part-time">Temps partiel</option>
                        <option value="cdd">CDD</option>
                    </select>
                </div>
            </div>
            <div class="field-group">
                <label class="field-label" for="desc">Description</label>
                <textarea id="desc" class="field-textarea" rows="4" required></textarea>
            </div>
            <button type="submit" class="register-submit" id="pubBtn">Publier</button>
        </form>
    </section>
</div>

<script type="module">
import {
    auth,
    fetchUserProfile,
    createOffre,
    deleteOffre,
    listOffres,
    listAvisForPro,
    listCandidaturesForCoiffeur,
    updateOffreStatus,
    getFirebaseErrorMessage
} from "./firebase.js";
import { onAuthStateChanged } from "./firebase.js";
import { initLocationFields, readLocationFromFields } from "./location-utils.js";
import { computeAvisSummary, formatAvisAvg } from "./avis-display-utils.js";
import {
    escapeHtml,
    getContractType,
    getContractLabel,
    formatOfferLocation,
    formatOfferRemuneration,
    formatOfferPublishedRelative
} from "./offre-display-utils.js";

const listEl = document.getElementById("offresList");
const errEl = document.getElementById("err");
const salonSection = document.getElementById("salonFormSection");
const searchEl = document.getElementById("jobsSearchInput");
const tabsEl = document.getElementById("jobsTabs");
const countEl = document.getElementById("jobsCountText");

let myUid = null;
let myName = "";
let isSalon = false;
let isCoiffeur = false;
/** offerId → statut candidature (pending | accepted | rejected) */
let myCandidatureStatusByOffer = new Map();
let activeFilter = "all";
let searchTerm = "";
let cachedRows = [];
const salonRatingByUid = new Map();

function isSalonRole(raw) {
    return String(raw || "").trim().toLowerCase() === "salon";
}

async function refreshSalonRatings(rows) {
    const uids = [...new Set(rows.map((o) => String(o.salonUid || "").trim()).filter(Boolean))];
    await Promise.all(
        uids.map(async (uid) => {
            if (salonRatingByUid.has(uid)) return;
            try {
                const avis = await listAvisForPro(uid);
                const summary = computeAvisSummary(avis);
                salonRatingByUid.set(uid, formatAvisAvg(summary.avg));
            } catch {
                salonRatingByUid.set(uid, null);
            }
        })
    );
}

function syncRemunerationFields() {
    const type = String(document.getElementById("remunerationType")?.value || "").trim();
    const monthlyWrap = document.getElementById("salaryMonthlyWrap");
    const noteWrap = document.getElementById("remunerationNoteWrap");
    const salaryInput = document.getElementById("salaryFcfa");
    if (!monthlyWrap || !noteWrap) return;
    if (type === "monthly") {
        monthlyWrap.hidden = false;
        noteWrap.hidden = false;
        if (salaryInput) salaryInput.required = true;
    } else if (type === "per_prestation") {
        monthlyWrap.hidden = true;
        noteWrap.hidden = false;
        if (salaryInput) {
            salaryInput.required = false;
            salaryInput.value = "";
        }
    } else {
        monthlyWrap.hidden = true;
        noteWrap.hidden = true;
        if (salaryInput) salaryInput.required = false;
    }
}

function offerMatchesFilters(offer) {
    const query = searchTerm.trim().toLowerCase();
    const type = getContractType(offer);
    const matchesType = activeFilter === "all" ? true : type === activeFilter;
    if (!matchesType) return false;
    if (!query) return true;
    const haystack = `${offer?.title || ""} ${offer?.description || ""} ${offer?.city || ""} ${offer?.quartier || ""} ${offer?.salonName || ""} ${formatOfferRemuneration(offer)}`.toLowerCase();
    return haystack.includes(query);
}

function renderList(rows) {
    listEl.innerHTML = "";
    const visible = rows.filter(offerMatchesFilters);
    countEl.textContent = `${visible.length} Poste${visible.length > 1 ? "s" : ""} Disponible${visible.length > 1 ? "s" : ""}`;
    if (!visible.length) {
        const li = document.createElement("li");
        li.className = "jobs-empty";
        li.textContent = "Aucune offre ne correspond à votre recherche.";
        listEl.appendChild(li);
        return;
    }
    for (const o of visible) {
        const type = getContractType(o);
        const dateText = formatOfferPublishedRelative(o.createdAt);
        const location = formatOfferLocation(o);
        const remuneration = formatOfferRemuneration(o, { short: true });
        const desc = (o.description || "").trim() || "Le salon recherche un profil motivé pour rejoindre son équipe.";
        const shortDesc = desc.length > 140 ? `${desc.slice(0, 140)}…` : desc;
        const detailUrl = "offre-detail.html?offre=" + encodeURIComponent(o.id);
        const salonUid = String(o.salonUid || "");
        const rating = salonRatingByUid.get(salonUid);
        const salonLine =
            escapeHtml(o.salonName || "Salon partenaire") + (rating ? ` <span class="jobs-card__rating">⭐ ${escapeHtml(rating)}</span>` : "");

        const isOwner = isSalon && salonUid === String(myUid || "");
        const isFilled = String(o.status || "").trim().toLowerCase() === "filled";
        const deleteBtn = isOwner
            ? `<button type="button" class="jobs-card__delete" data-offre-delete="${escapeHtml(o.id)}">Retirer</button>`
            : "";
        const statusBtn = isOwner
            ? isFilled
                ? `<button type="button" class="jobs-card__status-btn" data-offre-reopen="${escapeHtml(o.id)}">Rouvrir</button>`
                : `<button type="button" class="jobs-card__status-btn" data-offre-fill="${escapeHtml(o.id)}">Pourvue</button>`
            : "";
        const filledBadge = isFilled ? `<span class="jobs-badge jobs-badge--filled">Poste pourvu</span>` : "";

        const li = document.createElement("li");
        li.className = "jobs-item";
        li.innerHTML =
            `<article class="jobs-card jobs-card--v2">` +
            `<div class="jobs-card__top">` +
            `<div class="jobs-card__thumb" aria-hidden="true"></div>` +
            `<div class="jobs-card__head">` +
            `<h3 class="jobs-card__title">${escapeHtml(o.title || "Offre")}</h3>` +
            `<p class="jobs-card__salon">${salonLine}</p>` +
            `<p class="jobs-card__meta"><span class="jobs-card__meta-icon">📍</span>${escapeHtml(location)}</p>` +
            `<p class="jobs-card__meta"><span class="jobs-card__meta-icon">💰</span>${escapeHtml(remuneration)}</p>` +
            `</div>` +
            `<span class="jobs-badge">${escapeHtml(getContractLabel(type))}</span>` +
            filledBadge +
            `</div>` +
            `<p class="jobs-card__desc">${escapeHtml(shortDesc)}</p>` +
            `<div class="jobs-card__foot">` +
            `<span class="jobs-card__date">📅 ${escapeHtml(dateText)}</span>` +
            `<div class="jobs-card__foot-actions">` +
            deleteBtn +
            statusBtn +
            `<a class="jobs-card__view" href="${detailUrl}">Voir l'offre</a>` +
            `</div></div></article>`;
        listEl.appendChild(li);
    }
}

async function loadList() {
    cachedRows = await listOffres(isSalon ? myUid : undefined);
    await refreshSalonRatings(cachedRows);
    renderList(cachedRows);
}

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    myUid = user.uid;
    const prof = await fetchUserProfile(user.uid);
    myName = prof?.salonName || prof?.name || "";
    const role = prof?.role || "";
    const roleKey = String(role || "")
        .trim()
        .toLowerCase();
    if (roleKey === "client") {
        window.location.replace("dashboard.html");
        return;
    }
    isSalon = isSalonRole(role);
    isCoiffeur = roleKey === "coiffeur";
    if (isCoiffeur) {
        try {
            const mine = await listCandidaturesForCoiffeur(myUid);
            myCandidatureStatusByOffer = new Map(
                mine.map((c) => [String(c.offerId || ""), String(c.status || "pending").toLowerCase()])
            );
        } catch {
            myCandidatureStatusByOffer = new Map();
        }
    }
    if (isSalon) {
        salonSection.hidden = false;
        initLocationFields({
            citySelect: document.getElementById("offreCity"),
            quartierSelect: document.getElementById("offreQuartier"),
            cityOtherWrap: document.getElementById("offreCityOtherWrap"),
            cityOtherInput: document.getElementById("offreCityOther"),
            quartierOtherWrap: document.getElementById("offreQuartierOtherWrap"),
            quartierOtherInput: document.getElementById("offreQuartierOther"),
            storedCity: prof?.city || "",
            storedQuartier: prof?.quartier || ""
        });
        const paySel = document.getElementById("remunerationType");
        if (paySel) {
            paySel.addEventListener("change", syncRemunerationFields);
            syncRemunerationFields();
        }
    }
    try {
        await loadList();
    } catch (e) {
        errEl.textContent = getFirebaseErrorMessage(e);
        errEl.hidden = false;
    }
});

tabsEl.addEventListener("click", (event) => {
    const btn = event.target.closest(".jobs-tab");
    if (!btn) return;
    activeFilter = btn.dataset.filter || "all";
    for (const tab of tabsEl.querySelectorAll(".jobs-tab")) {
        const selected = tab === btn;
        tab.classList.toggle("is-active", selected);
        tab.setAttribute("aria-selected", selected ? "true" : "false");
    }
    renderList(cachedRows);
});

searchEl.addEventListener("input", () => {
    searchTerm = searchEl.value || "";
    renderList(cachedRows);
});

listEl.addEventListener("click", async (e) => {
    const fillBtn = e.target.closest("[data-offre-fill]");
    if (fillBtn && myUid) {
        const offerId = fillBtn.getAttribute("data-offre-fill");
        if (!offerId) return;
        fillBtn.disabled = true;
        errEl.hidden = true;
        try {
            await updateOffreStatus(offerId, myUid, "filled");
            await loadList();
        } catch (x) {
            errEl.textContent = getFirebaseErrorMessage(x);
            errEl.hidden = false;
            fillBtn.disabled = false;
        }
        return;
    }
    const reopenBtn = e.target.closest("[data-offre-reopen]");
    if (reopenBtn && myUid) {
        const offerId = reopenBtn.getAttribute("data-offre-reopen");
        if (!offerId) return;
        reopenBtn.disabled = true;
        errEl.hidden = true;
        try {
            await updateOffreStatus(offerId, myUid, "open");
            await loadList();
        } catch (x) {
            errEl.textContent = getFirebaseErrorMessage(x);
            errEl.hidden = false;
            reopenBtn.disabled = false;
        }
        return;
    }
    const btn = e.target.closest("[data-offre-delete]");
    if (!btn || !myUid) return;
    const offerId = btn.getAttribute("data-offre-delete");
    if (!offerId) return;
    if (
        !window.confirm(
            "Retirer cette offre ? Elle ne sera plus visible et les candidatures associées seront supprimées."
        )
    ) {
        return;
    }
    btn.disabled = true;
    errEl.hidden = true;
    try {
        await deleteOffre(offerId, myUid);
        await loadList();
    } catch (x) {
        errEl.textContent = getFirebaseErrorMessage(x);
        errEl.hidden = false;
        btn.disabled = false;
    }
});

document.getElementById("offreForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fe = document.getElementById("fe");
    const fo = document.getElementById("fo");
    fe.hidden = true;
    fo.hidden = true;
    if (!isSalon || !myUid) return;
    const payType = String(document.getElementById("remunerationType").value || "").trim();
    if (!payType) {
        fe.textContent = "Indiquez si le poste est rémunéré au mois ou à la prestation.";
        fe.hidden = false;
        return;
    }
    if (payType === "monthly") {
        const salary = Number.parseInt(String(document.getElementById("salaryFcfa").value || "").trim(), 10);
        if (!Number.isFinite(salary) || salary <= 0) {
            fe.textContent = "Indiquez un salaire mensuel en FCFA (nombre entier positif).";
            fe.hidden = false;
            return;
        }
    }
    const loc = readLocationFromFields({
        citySelect: document.getElementById("offreCity"),
        quartierSelect: document.getElementById("offreQuartier"),
        cityOtherInput: document.getElementById("offreCityOther"),
        quartierOtherInput: document.getElementById("offreQuartierOther")
    });
    if (!loc.ok) {
        fe.textContent = loc.message;
        fe.hidden = false;
        return;
    }
    const btn = document.getElementById("pubBtn");
    btn.disabled = true;
    try {
        await createOffre(
            myUid,
            myName,
            document.getElementById("title").value,
            document.getElementById("desc").value,
            loc.city,
            document.getElementById("contractType").value,
            {
                quartier: loc.quartier,
                remunerationType: payType,
                salaryFcfa:
                    payType === "monthly" ? document.getElementById("salaryFcfa").value : null,
                remunerationNote: document.getElementById("remunerationNote").value
            }
        );
        fo.textContent = "Offre publiée.";
        fo.hidden = false;
        document.getElementById("offreForm").reset();
        syncRemunerationFields();
        const profAfter = await fetchUserProfile(myUid);
        initLocationFields({
            citySelect: document.getElementById("offreCity"),
            quartierSelect: document.getElementById("offreQuartier"),
            cityOtherWrap: document.getElementById("offreCityOtherWrap"),
            cityOtherInput: document.getElementById("offreCityOther"),
            quartierOtherWrap: document.getElementById("offreQuartierOtherWrap"),
            quartierOtherInput: document.getElementById("offreQuartierOther"),
            storedCity: profAfter?.city || "",
            storedQuartier: profAfter?.quartier || ""
        });
        await loadList();
    } catch (x) {
        fe.textContent = getFirebaseErrorMessage(x);
        fe.hidden = false;
    } finally {
        btn.disabled = false;
    }
});
</script>

</body>
</html>
