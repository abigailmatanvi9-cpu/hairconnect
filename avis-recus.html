<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis reçus — HairConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page hc-theme-pro">

<div class="login-container subpage-container subpage-wide">
    <header class="login-header">
        <a href="dashboard.html" class="login-back" aria-label="Retour">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
        </a>
        <h1 class="login-title">Avis reçus</h1>
    </header>

    <p id="err" class="form-error" role="alert" hidden></p>
    <ul id="list" class="pro-list"></ul>
</div>

<script type="module">
import { auth, listAvisForPro, getFirebaseErrorMessage } from "./firebase.js";
import { onAuthStateChanged } from "./firebase.js";

const listEl = document.getElementById("list");
const errEl = document.getElementById("err");

function stars(n) {
    const x = Math.min(5, Math.max(1, Number(n) || 0));
    return "★".repeat(x) + "☆".repeat(5 - x);
}

function escapeHtml(s) {
    return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    try {
        const rows = await listAvisForPro(user.uid);
        listEl.innerHTML = "";
        if (!rows.length) {
            const li = document.createElement("li");
            li.className = "pro-card pro-card--empty";
            li.textContent = "Pas encore d’avis.";
            listEl.appendChild(li);
            return;
        }
        for (const a of rows) {
            const li = document.createElement("li");
            li.className = "pro-card";
            const photo = a.photoUrl
                ? "<p class=\"pro-card-links\"><a href=\"" +
                  escapeHtml(a.photoUrl) +
                  "\" target=\"_blank\" rel=\"noopener\">Photo</a></p>"
                : "";
            li.innerHTML =
                "<strong>" +
                stars(a.rating) +
                "</strong>" +
                "<p class=\"pro-card-snippet\">" +
                escapeHtml(a.comment || "") +
                "</p>" +
                photo;
            listEl.appendChild(li);
        }
    } catch (e) {
        errEl.textContent = getFirebaseErrorMessage(e);
        errEl.hidden = false;
    }
});
</script>

</body>
</html>
