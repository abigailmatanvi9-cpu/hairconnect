<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis reçus — HairConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page hc-theme-pro">

<div class="login-container subpage-container subpage-wide ar-hub-page">
    <header class="login-header">
        <a href="dashboard.html" class="login-back" aria-label="Retour">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
        </a>
        <h1 class="login-title">Avis reçus</h1>
    </header>

    <p id="err" class="form-error" role="alert" hidden></p>
    <p id="ok" class="form-success" role="status" hidden></p>

    <div id="summary" class="ar-hub-summary-wrap" hidden></div>

    <div id="empty" class="ar-hub-empty" hidden>
        <p class="ar-hub-empty__title">⭐ Aucun avis pour le moment</p>
        <p class="ar-hub-empty__text">Les retours de vos clientes apparaîtront ici après leurs prestations.</p>
    </div>

    <ul id="list" class="ar-hub-grid" aria-live="polite"></ul>
</div>

<script type="module">
import { auth, listAvisForPro, replyToAvis, fetchUserProfile, getFirebaseErrorMessage } from "./firebase.js";
import { onAuthStateChanged } from "./firebase.js";
import {
    computeAvisSummary,
    renderAvisSummaryHtml,
    createAvisCardElement,
    buildClientProfileMap,
    avisMillis
} from "./avis-display-utils.js";

const listEl = document.getElementById("list");
const errEl = document.getElementById("err");
const okEl = document.getElementById("ok");
const summaryEl = document.getElementById("summary");
const emptyEl = document.getElementById("empty");

let proUid = null;

function showErr(msg) {
    if (!errEl) return;
    if (!msg) {
        errEl.hidden = true;
        errEl.textContent = "";
        return;
    }
    errEl.textContent = msg;
    errEl.hidden = false;
}

function showOk(msg) {
    if (!okEl) return;
    if (!msg) {
        okEl.hidden = true;
        okEl.textContent = "";
        return;
    }
    okEl.textContent = msg;
    okEl.hidden = false;
}

async function renderAvisPage(rows) {
    if (!listEl) return;
    listEl.innerHTML = "";
    showErr("");
    const sorted = [...rows].sort((a, b) => avisMillis(b.createdAt) - avisMillis(a.createdAt));
    const summary = computeAvisSummary(sorted);

    if (summaryEl) {
        if (sorted.length) {
            summaryEl.innerHTML = renderAvisSummaryHtml(summary);
            summaryEl.hidden = false;
        } else {
            summaryEl.innerHTML = "";
            summaryEl.hidden = true;
        }
    }

    if (!sorted.length) {
        if (emptyEl) emptyEl.hidden = false;
        listEl.hidden = true;
        return;
    }
    if (emptyEl) emptyEl.hidden = true;
    listEl.hidden = false;

    const profileMap = await buildClientProfileMap(sorted, fetchUserProfile);
    for (const avis of sorted) {
        const clientProfile = profileMap[avis.fromClientUid] || null;
        const card = createAvisCardElement(avis, clientProfile, {
            avisId: avis.id,
            allowReply: true
        });
        listEl.appendChild(card);
    }
}

listEl?.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-avis-reply]");
    if (!btn || !proUid) return;
    const avisId = String(btn.dataset.avisReply || "").trim();
    const safeId = avisId.replace(/[^a-zA-Z0-9_-]/g, "");
    const textarea = document.getElementById(`reply-${safeId}`);
    const text = String(textarea?.value || "").trim();
    if (!text) {
        showErr("Écrivez une réponse avant de publier.");
        return;
    }
    btn.disabled = true;
    showErr("");
    showOk("");
    try {
        await replyToAvis(avisId, proUid, text);
        showOk("Réponse publiée.");
        const rows = await listAvisForPro(proUid);
        await renderAvisPage(rows);
    } catch (err) {
        showErr(getFirebaseErrorMessage(err));
    } finally {
        btn.disabled = false;
    }
});

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    proUid = user.uid;
    try {
        const rows = await listAvisForPro(user.uid);
        await renderAvisPage(rows);
    } catch (e) {
        showErr(getFirebaseErrorMessage(e));
    }
});
</script>

</body>
</html>
