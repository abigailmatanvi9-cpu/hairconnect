<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — HairConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page hc-theme-pro auth-galaxy">

<div class="auth-galaxy-page">
    <button type="button" class="auth-galaxy-back" id="loginBackBtn" aria-label="Retour">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
    </button>

    <h1 class="auth-galaxy-page-title">Bonjour, connectez-vous !</h1>

    <div class="auth-galaxy-card login-container">
        <form id="loginForm" class="auth-galaxy-form">
            <p id="formError" class="form-error auth-galaxy-error" role="alert" hidden></p>

            <div class="auth-galaxy-field">
                <label class="auth-galaxy-label" for="email">E-mail</label>
                <div class="auth-galaxy-line">
                    <input type="email" id="email" name="email" placeholder="votre.email@exemple.com" autocomplete="email" required>
                    <span class="auth-galaxy-icon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg>
                    </span>
                </div>
            </div>

            <div class="auth-galaxy-field">
                <label class="auth-galaxy-label" for="password">Mot de passe</label>
                <div class="auth-galaxy-line">
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                    <button type="button" class="password-toggle auth-galaxy-toggle" data-target="password" aria-label="Afficher le mot de passe" aria-pressed="false">
                        <svg class="password-toggle__icon password-toggle__icon--show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        <svg class="password-toggle__icon password-toggle__icon--hide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24" aria-hidden="true" hidden><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
                    </button>
                </div>
            </div>

            <div class="auth-galaxy-row">
                <label class="auth-galaxy-remember">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <span>Se souvenir de moi</span>
                </label>
                <a href="#" class="auth-galaxy-forgot">Mot de passe oublié ?</a>
            </div>

            <button type="submit" class="auth-galaxy-submit" id="loginSubmit">Connexion</button>
        </form>

        <p class="auth-galaxy-switch">Pas de compte ? <a href="register.html">S'inscrire</a></p>
    </div>
</div>

<script type="module">
import { loginUser, getFirebaseErrorMessage } from "./firebase.js";

const form = document.getElementById("loginForm");
const formError = document.getElementById("formError");
const submitBtn = document.getElementById("loginSubmit");
const emailInput = document.getElementById("email");
const rememberMe = document.getElementById("rememberMe");

const REMEMBER_KEY = "hairconnect_remember_email";

try {
    const saved = localStorage.getItem(REMEMBER_KEY);
    if (saved) {
        emailInput.value = saved;
        rememberMe.checked = true;
    }
} catch { /* ignore */ }

function setupPasswordToggle(btn) {
    if (!btn) return;
    const targetId = btn.getAttribute("data-target");
    const input = targetId ? document.getElementById(targetId) : null;
    if (!input) return;
    const iconShow = btn.querySelector(".password-toggle__icon--show");
    const iconHide = btn.querySelector(".password-toggle__icon--hide");
    const setVisible = (visible) => {
        const show = Boolean(visible);
        input.setAttribute("type", show ? "text" : "password");
        btn.setAttribute("aria-pressed", show ? "true" : "false");
        btn.setAttribute("aria-label", show ? "Masquer le mot de passe" : "Afficher le mot de passe");
        if (iconShow) iconShow.hidden = show;
        if (iconHide) iconHide.hidden = !show;
    };
    btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        setVisible(input.getAttribute("type") === "password");
    });
    btn.addEventListener("mousedown", (e) => e.preventDefault());
}
document.querySelectorAll(".password-toggle").forEach((btn) => setupPasswordToggle(btn));

function navigateLoginBack() {
    const ref = document.referrer || "";
    let refFile = "";
    try {
        if (ref) refFile = new URL(ref).pathname.split("/").pop().toLowerCase() || "";
    } catch {
        refFile = "";
    }

    if (/dashboard\.html/i.test(ref)) {
        window.location.replace("index.html");
        return;
    }

    const sameSite = ref.startsWith(`${location.origin}`);
    if (sameSite && refFile && refFile !== "login.html" && window.history.length > 1) {
        window.history.back();
        return;
    }

    window.location.replace("index.html");
}

document.getElementById("loginBackBtn")?.addEventListener("click", () => navigateLoginBack());

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    formError.hidden = true;
    formError.textContent = "";

    const email = emailInput.value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        formError.textContent = "Veuillez saisir l'e-mail et le mot de passe.";
        formError.hidden = false;
        return;
    }

    submitBtn.disabled = true;
    try {
        await loginUser(email, password);
        try {
            if (rememberMe.checked) localStorage.setItem(REMEMBER_KEY, email);
            else localStorage.removeItem(REMEMBER_KEY);
        } catch { /* ignore */ }
        window.location.href = "dashboard.html";
    } catch (err) {
        console.error(err);
        formError.textContent = getFirebaseErrorMessage(err);
        formError.hidden = false;
    } finally {
        submitBtn.disabled = false;
    }
});
</script>

</body>
</html>
