<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis clients — HairConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page hc-theme-pro">
<div class="login-container subpage-container subpage-wide">
    <header class="login-header">
        <a href="#" id="proAvisBack" class="login-back" aria-label="Retour à la fiche">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
        </a>
        <h1 class="login-title" id="proAvisTitle">Avis clients</h1>
    </header>

    <p id="guestBannerProAvis" class="guest-discovery-banner" hidden>
        <strong>Mode découverte.</strong> Consultation seule —
        <a href="login.html">connectez-vous</a> pour laisser un avis depuis la fiche du professionnel.
    </p>

    <p id="proAvisErr" class="form-error" role="alert" hidden></p>
    <p id="proAvisLead" class="subpage-lead" hidden></p>
    <ul id="proAvisList" class="pro-avis-page__list"></ul>
</div>

<script type="module">
import {
    auth,
    onAuthStateChanged,
    fetchUserProfile,
    listAvisForPro,
    isGuestDiscovery,
    clearGuestDiscovery,
    getFirebaseErrorMessage
} from "./firebase.js";

const params = new URLSearchParams(location.search);
const uid = params.get("uid");
const avisRet = params.get("ret");
const PROFILE_RET_PROPAGATE = new Set(["nearby-embed", "nearby-home"]);
const errEl = document.getElementById("proAvisErr");
const listEl = document.getElementById("proAvisList");
const leadEl = document.getElementById("proAvisLead");
const titleEl = document.getElementById("proAvisTitle");
const backEl = document.getElementById("proAvisBack");
const guestBar = document.getElementById("guestBannerProAvis");

function escapeHtml(s) {
    return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function avisDateText(createdAt) {
    const ms = createdAt?.toMillis ? createdAt.toMillis() : new Date(createdAt || 0).getTime();
    if (!ms) return "";
    return new Date(ms).toLocaleString("fr-FR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

function renderAvisPage(list) {
    if (!listEl) return;
    listEl.innerHTML = "";
    if (!list.length) {
        const li = document.createElement("li");
        li.className = "pro-avis-page__empty";
        li.textContent = "Pas encore d’avis sur ce profil.";
        listEl.appendChild(li);
        return;
    }
    const sorted = [...list].sort((a, b) => {
        const ta = a?.createdAt?.toMillis ? a.createdAt.toMillis() : new Date(a.createdAt || 0).getTime();
        const tb = b?.createdAt?.toMillis ? b.createdAt.toMillis() : new Date(b.createdAt || 0).getTime();
        return tb - ta;
    });
    for (const avis of sorted) {
        const li = document.createElement("li");
        li.className = "pro-avis-page__item";
        const rating = Math.max(1, Math.min(5, Number(avis.rating || 0))) || 0;
        const stars = rating ? "★".repeat(rating) + "☆".repeat(5 - rating) : "";
        const photoUrl = String(avis.photoUrl || "").trim();
        const photoBlock = photoUrl
            ? "<div class=\"public-publications__avis-photo\">" +
              "<a href=\"" +
              escapeHtml(photoUrl) +
              "\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Ouvrir la photo en grand\" class=\"public-publications__avis-photo-link\">" +
              "<img class=\"public-publications__img public-publications__img--avis\" src=\"" +
              escapeHtml(photoUrl) +
              "\" alt=\"Photo partagée avec l’avis\" loading=\"lazy\" decoding=\"async\">" +
              "</a>" +
              "</div>"
            : "";
        li.innerHTML =
            "<p class=\"public-publications__meta\">" +
            escapeHtml(stars ? `${stars} · ${rating}/5` : "Avis") +
            (avisDateText(avis.createdAt) ? " · " + escapeHtml(avisDateText(avis.createdAt)) : "") +
            "</p>" +
            photoBlock +
            "<p class=\"public-publications__caption\">" +
            escapeHtml(String(avis.comment || "Sans commentaire.")) +
            "</p>";
        listEl.appendChild(li);
    }
}

if (!uid) {
    errEl.textContent = "Paramètre uid manquant.";
    errEl.hidden = false;
} else {
    const retQ =
        avisRet && PROFILE_RET_PROPAGATE.has(avisRet) ? "&ret=" + encodeURIComponent(avisRet) : "";
    const backUrl = "profil-public.html?uid=" + encodeURIComponent(uid) + retQ;
    backEl.href = backUrl;
    backEl.addEventListener("click", (e) => {
        e.preventDefault();
        window.location.replace(backUrl);
    });

    onAuthStateChanged(auth, async (user) => {
        if (user) clearGuestDiscovery();
        if (!user && !isGuestDiscovery()) {
            window.location.href = "login.html";
            return;
        }

        let d;
        try {
            d = await fetchUserProfile(uid);
        } catch (e) {
            errEl.textContent = getFirebaseErrorMessage(e);
            errEl.hidden = false;
            return;
        }
        if (!d) {
            errEl.textContent = "Ce profil n’existe pas.";
            errEl.hidden = false;
            return;
        }

        const proName = d.salonName || d.name || "Ce professionnel";
        titleEl.textContent = "Avis — " + proName;
        leadEl.textContent =
            "Notes, commentaires et éventuelles photos publiées par les clients pour " + proName + ".";
        leadEl.hidden = false;

        if (!user && isGuestDiscovery()) {
            guestBar.hidden = false;
        } else if (guestBar) {
            guestBar.hidden = true;
        }

        try {
            const avis = await listAvisForPro(uid);
            renderAvisPage(avis);
        } catch (e2) {
            errEl.textContent = getFirebaseErrorMessage(e2);
            errEl.hidden = false;
        }
    });
}
</script>
</body>
</html>
