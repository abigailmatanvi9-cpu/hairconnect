<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis clients — HairConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page hc-theme-pro">
<div class="login-container subpage-container subpage-wide ar-hub-page">
    <header class="login-header">
        <a href="#" id="proAvisBack" class="login-back" aria-label="Retour à la fiche">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
        </a>
        <h1 class="login-title" id="proAvisTitle">Avis clients</h1>
    </header>

    <p id="proAvisErr" class="form-error" role="alert" hidden></p>
    <div id="proAvisSummary" class="ar-hub-summary-wrap" hidden></div>
    <ul id="proAvisList" class="ar-hub-grid"></ul>
</div>

<script type="module">
import {
    auth,
    onAuthStateChanged,
    fetchUserProfile,
    listAvisForPro,
    getFirebaseErrorMessage
} from "./firebase.js";
import {
    computeAvisSummary,
    renderAvisSummaryHtml,
    createAvisCardElement,
    buildClientProfileMap,
    avisMillis
} from "./avis-display-utils.js";

const params = new URLSearchParams(location.search);
const uid = params.get("uid");
const avisRet = params.get("ret");
const PROFILE_RET_PROPAGATE = new Set(["nearby-embed", "nearby-home"]);
const errEl = document.getElementById("proAvisErr");
const listEl = document.getElementById("proAvisList");
const summaryEl = document.getElementById("proAvisSummary");
const titleEl = document.getElementById("proAvisTitle");
const backEl = document.getElementById("proAvisBack");

async function renderAvisPage(list) {
    if (!listEl) return;
    listEl.innerHTML = "";
    const sorted = [...list].sort((a, b) => avisMillis(b.createdAt) - avisMillis(a.createdAt));
    const summary = computeAvisSummary(sorted);
    if (summaryEl) {
        if (sorted.length) {
            summaryEl.innerHTML = renderAvisSummaryHtml(summary);
            summaryEl.hidden = false;
        } else {
            summaryEl.hidden = true;
            summaryEl.innerHTML = "";
        }
    }
    if (!sorted.length) {
        const li = document.createElement("li");
        li.className = "ar-hub-grid__empty";
        li.textContent = "Pas encore d’avis sur ce profil.";
        listEl.appendChild(li);
        return;
    }
    const profileMap = await buildClientProfileMap(sorted, fetchUserProfile);
    for (const avis of sorted) {
        const clientProfile = profileMap[avis.fromClientUid] || null;
        listEl.appendChild(createAvisCardElement(avis, clientProfile));
    }
}

if (!uid) {
    errEl.textContent = "Paramètre uid manquant.";
    errEl.hidden = false;
} else {
    const retQ =
        avisRet && PROFILE_RET_PROPAGATE.has(avisRet) ? "&ret=" + encodeURIComponent(avisRet) : "";
    const backUrl = "profil-public.html?uid=" + encodeURIComponent(uid) + retQ;
    backEl.href = backUrl;
    backEl.addEventListener("click", (e) => {
        e.preventDefault();
        window.location.replace(backUrl);
    });

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = "login.html";
            return;
        }

        let d;
        try {
            d = await fetchUserProfile(uid);
        } catch (e) {
            errEl.textContent = getFirebaseErrorMessage(e);
            errEl.hidden = false;
            return;
        }
        if (!d) {
            errEl.textContent = "Ce profil n’existe pas.";
            errEl.hidden = false;
            return;
        }

        const proName = d.salonName || d.name || "Ce professionnel";
        titleEl.textContent = "Avis — " + proName;

        try {
            const avis = await listAvisForPro(uid);
            await renderAvisPage(avis);
        } catch (e2) {
            errEl.textContent = getFirebaseErrorMessage(e2);
            errEl.hidden = false;
        }
    });
}
</script>
</body>
</html>
