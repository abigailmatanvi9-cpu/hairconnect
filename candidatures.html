<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatures — HairConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page hc-theme-pro">

<div class="login-container subpage-container subpage-wide">
    <header class="login-header">
        <a href="dashboard.html" class="login-back" id="backBtn" aria-label="Retour">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
        </a>
        <h1 class="login-title">Candidatures coiffeurs</h1>
    </header>

    <p class="subpage-lead">
        Gérez les candidatures reçues pour vos offres d'emploi. Le coiffeur est notifié par messagerie à chaque décision.
    </p>

    <div class="cand-hub-stats" id="candStats" aria-label="Statistiques candidatures">
        <div class="cand-hub-stats__item">
            <span class="cand-hub-stats__label">Total</span>
            <strong class="cand-hub-stats__val" id="statTotal">0</strong>
        </div>
        <div class="cand-hub-stats__item">
            <span class="cand-hub-stats__label">En attente</span>
            <strong class="cand-hub-stats__val" id="statPending">0</strong>
        </div>
        <div class="cand-hub-stats__item">
            <span class="cand-hub-stats__label">Acceptées</span>
            <strong class="cand-hub-stats__val" id="statAccepted">0</strong>
        </div>
        <div class="cand-hub-stats__item">
            <span class="cand-hub-stats__label">Refusées</span>
            <strong class="cand-hub-stats__val" id="statRejected">0</strong>
        </div>
    </div>

    <div class="candidature-filters jobs-tabs" id="candFilters" role="tablist" aria-label="Filtrer les candidatures">
        <button type="button" class="jobs-tab is-active" data-cand-filter="all" aria-selected="true">Toutes</button>
        <button type="button" class="jobs-tab" data-cand-filter="pending" aria-selected="false">En attente</button>
        <button type="button" class="jobs-tab" data-cand-filter="accepted" aria-selected="false">Acceptées</button>
        <button type="button" class="jobs-tab" data-cand-filter="rejected" aria-selected="false">Refusées</button>
    </div>

    <p id="err" class="form-error" role="alert" hidden></p>

    <ul id="list" class="cand-hub-grid" aria-live="polite"></ul>
</div>

<div id="candMessageModal" class="cand-message-modal" hidden aria-hidden="true">
    <div class="cand-message-modal__backdrop" data-cand-message-close tabindex="-1"></div>
    <div class="cand-message-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="candMessageTitle">
        <button type="button" class="cand-message-modal__close" data-cand-message-close aria-label="Fermer">×</button>
        <div id="candMessageContent"></div>
    </div>
</div>

<div id="candToast" class="hc-toast" role="status" aria-live="polite" hidden></div>

<script type="module">
import {
    auth,
    fetchUserProfile,
    listCandidaturesForSalon,
    respondCandidature,
    listAvisForPro,
    getFirebaseErrorMessage,
    HAIRCONNECT_METIERS
} from "./firebase.js";
import { onAuthStateChanged } from "./firebase.js";
import { resolveUserRole, authUserId, isCoiffeurRole } from "./role-utils.js";
import { computeAvisSummary, formatAvisAvg } from "./avis-display-utils.js";

const listEl = document.getElementById("list");
const errEl = document.getElementById("err");
const toastEl = document.getElementById("candToast");
const messageModalEl = document.getElementById("candMessageModal");
const messageContentEl = document.getElementById("candMessageContent");
const filtersEl = document.getElementById("candFilters");
const inDashEmbed = window.self !== window.top;

let myUid = null;
let allRows = [];
let activeFilter = "all";
let coiffeurExtras = {};
let currentModalCandId = null;
let toastTimer = null;

const backBtn = document.getElementById("backBtn");
if (backBtn && inDashEmbed) {
    backBtn.addEventListener("click", (e) => {
        e.preventDefault();
        try {
            window.parent.postMessage({ type: "hc-dash-close-embed" }, "*");
        } catch (_) {
            window.top.location.href = "dashboard.html";
        }
    });
}

function escapeHtml(s) {
    return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function formatDate(raw) {
    if (!raw) return "";
    try {
        const d =
            raw && typeof raw.toMillis === "function"
                ? new Date(raw.toMillis())
                : new Date(raw);
        if (Number.isNaN(d.getTime())) return "";
        return new Intl.DateTimeFormat("fr-FR", {
            day: "numeric",
            month: "short",
            year: "numeric"
        }).format(d);
    } catch {
        return "";
    }
}

function normalizeStatus(raw) {
    const s = String(raw || "pending").toLowerCase();
    return s === "accepted" || s === "rejected" ? s : "pending";
}

function statusLabel(st) {
    if (st === "accepted") return "Acceptée";
    if (st === "rejected") return "Refusée";
    return "En attente";
}

function statusIcon(st) {
    if (st === "accepted") return "✓";
    if (st === "rejected") return "✗";
    return "⏳";
}

function formatRoleLabel(role) {
    const r = String(role || "").trim().toLowerCase();
    if (r.includes("coiffeuse")) return "Coiffeuse indépendante";
    if (r.includes("coiffeur")) return "Coiffeur indépendant";
    return String(role || "Coiffeur").trim() || "Coiffeur";
}

function parseMetiers(proMetiers) {
    if (!proMetiers) return [];
    if (Array.isArray(proMetiers)) return proMetiers.map(String);
    if (typeof proMetiers === "string") {
        try {
            const parsed = JSON.parse(proMetiers);
            return Array.isArray(parsed) ? parsed.map(String) : [];
        } catch {
            return [];
        }
    }
    return [];
}

function metierLabels(proMetiers) {
    const slugs = parseMetiers(proMetiers);
    const bySlug = Object.fromEntries(HAIRCONNECT_METIERS.map((m) => [m.slug, m.label]));
    return slugs.map((s) => bySlug[String(s).toLowerCase()] || s).filter(Boolean);
}

function formatLocation(co) {
    const parts = [];
    const q = String(co?.quartier || "").trim();
    const c = String(co?.city || "").trim();
    if (q) parts.push(q);
    if (c) parts.push(c);
    return parts.join(", ") || "—";
}

function deriveExperienceLabel(co) {
    const bio = String(co?.bio || "").trim();
    const yearsMatch = bio.match(/(\d+)\s*ans/i);
    if (yearsMatch) return yearsMatch[1] + " ans d'expérience";
    const metiers = metierLabels(co?.proMetiers);
    if (metiers.length) return metiers.slice(0, 2).join(" · ");
    return formatRoleLabel(co?.role);
}

function coiffeurRatingLabel(uid) {
    const extra = coiffeurExtras[uid];
    if (!extra || extra.avg == null) return null;
    return "⭐ " + extra.avg + "/5";
}

function updateStats() {
    const counts = { pending: 0, accepted: 0, rejected: 0 };
    for (const c of allRows) {
        const st = normalizeStatus(c.status);
        counts[st] = (counts[st] || 0) + 1;
    }
    const total = allRows.length;
    const set = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.textContent = String(val);
    };
    set("statTotal", total);
    set("statPending", counts.pending);
    set("statAccepted", counts.accepted);
    set("statRejected", counts.rejected);
}

function showToast(message) {
    if (!toastEl) return;
    toastEl.textContent = message;
    toastEl.hidden = false;
    toastEl.classList.add("is-visible");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toastEl.classList.remove("is-visible");
        toastEl.hidden = true;
    }, 3200);
}

function renderModalActionsHtml(c) {
    const st = normalizeStatus(c.status);
    const id = escapeHtml(c.id);
    const coiffeurUid = String(c.coiffeurUid || c.coiffeur?.id || "").trim();
    let actions = "";
    if (st === "pending") {
        actions =
            '<button type="button" class="cand-message-modal__btn cand-message-modal__btn--accept" data-cand-accept="' +
            id +
            '">✓ Accepter</button>' +
            '<button type="button" class="cand-message-modal__btn cand-message-modal__btn--reject" data-cand-reject="' +
            id +
            '">✗ Refuser</button>';
    } else if (st === "accepted") {
        actions =
            '<a class="cand-message-modal__btn cand-message-modal__btn--msg" href="messagerie.html?to=' +
            encodeURIComponent(coiffeurUid) +
            '">💬 Contacter</a>';
    } else if (st === "rejected") {
        actions =
            '<button type="button" class="cand-message-modal__btn cand-message-modal__btn--reopen" data-cand-reaccept="' +
            id +
            '">↺ Réexaminer et accepter</button>';
    }
    return (
        '<div class="cand-message-modal__actions">' +
        actions +
        '<a class="cand-message-modal__btn cand-message-modal__btn--ghost" href="profil-public.html?uid=' +
        encodeURIComponent(coiffeurUid) +
        '">Voir le profil</a></div>'
    );
}

function renderMessageModalHtml(c) {
    const co = c.coiffeur || {};
    const off = c.offre || {};
    const st = normalizeStatus(c.status);
    const name = String(co.name || "Coiffeur").trim();
    const offerTitle = String(off.title || "Offre").trim();
    const dateText = formatDate(c.createdAt);
    const rawMessage = c.message != null ? String(c.message) : "";
    const messageHtml = rawMessage.trim() ? escapeHtml(rawMessage) : "(Aucun message joint.)";

    return (
        '<header class="cand-message-modal__head">' +
        (co.photoUrl
            ? '<img class="cand-message-modal__avatar" src="' +
              escapeHtml(co.photoUrl) +
              '" alt="" loading="lazy">'
            : '<span class="cand-message-modal__avatar cand-message-modal__avatar--ph" aria-hidden="true">👩</span>') +
        '<div class="cand-message-modal__intro">' +
        '<h2 class="cand-message-modal__name" id="candMessageTitle">' +
        escapeHtml(name) +
        "</h2>" +
        '<p class="cand-message-modal__meta">Pour « ' +
        escapeHtml(offerTitle) +
        " »" +
        (dateText ? " · " + escapeHtml(dateText) : "") +
        "</p>" +
        '<span class="cand-card__status cand-card__status--' +
        escapeHtml(st) +
        '">' +
        statusIcon(st) +
        " " +
        escapeHtml(statusLabel(st)) +
        "</span></div></header>" +
        '<div class="cand-message-modal__body">' +
        messageHtml +
        "</div>" +
        renderModalActionsHtml(c)
    );
}

function openMessageModal(c) {
    if (!messageModalEl || !messageContentEl || !c) return;
    currentModalCandId = c.id;
    messageContentEl.innerHTML = renderMessageModalHtml(c);
    messageModalEl.hidden = false;
    messageModalEl.setAttribute("aria-hidden", "false");
    document.body.classList.add("cand-modal-open");
    messageModalEl.querySelector(".cand-message-modal__close")?.focus();
}

function closeMessageModal() {
    if (!messageModalEl) return;
    messageModalEl.hidden = true;
    messageModalEl.setAttribute("aria-hidden", "true");
    document.body.classList.remove("cand-modal-open");
    if (messageContentEl) messageContentEl.innerHTML = "";
    currentModalCandId = null;
}

function renderCandidatureCard(c) {
    const co = c.coiffeur || {};
    const off = c.offre || {};
    const coiffeurUid = String(c.coiffeurUid || co.id || "").trim();
    const name = String(co.name || "Coiffeur").trim();
    const offerTitle = String(off.title || "Offre").trim();
    const dateText = formatDate(c.createdAt);
    const st = normalizeStatus(c.status);
    const rating = coiffeurRatingLabel(coiffeurUid);
    const location = formatLocation(co);
    const experience = deriveExperienceLabel(co);
    const li = document.createElement("li");
    li.className = "cand-card";
    li.dataset.candId = c.id;
    li.dataset.status = st;
    li.innerHTML =
        '<div class="cand-card__body">' +
        '<div class="cand-card__top">' +
        (co.photoUrl
            ? '<img class="cand-card__avatar" src="' +
              escapeHtml(co.photoUrl) +
              '" alt="" loading="lazy">'
            : '<span class="cand-card__avatar cand-card__avatar--ph" aria-hidden="true">👩</span>') +
        '<div class="cand-card__head">' +
        '<h2 class="cand-card__name">' +
        escapeHtml(name) +
        "</h2>" +
        (rating ? '<p class="cand-card__rating">' + escapeHtml(rating) + "</p>" : "") +
        '<p class="cand-card__exp">💼 ' +
        escapeHtml(experience) +
        "</p>" +
        '<p class="cand-card__loc">📍 ' +
        escapeHtml(location) +
        "</p>" +
        "</div></div>" +
        '<p class="cand-card__offer"><span class="cand-card__k">Postule pour</span> ' +
        escapeHtml(offerTitle) +
        "</p>" +
        (dateText ? '<p class="cand-card__date">📅 ' + escapeHtml(dateText) + "</p>" : "") +
        '<span class="cand-card__status cand-card__status--' +
        escapeHtml(st) +
        '">' +
        statusIcon(st) +
        " " +
        escapeHtml(statusLabel(st)) +
        "</span></div>" +
        '<div class="cand-card__actions">' +
        '<button type="button" class="cand-card__btn cand-card__btn--primary" data-cand-message="' +
        escapeHtml(c.id) +
        '">Lire la candidature</button>' +
        "</div>";

    return li;
}

function renderList() {
    listEl.innerHTML = "";
    const rows =
        activeFilter === "all"
            ? allRows
            : allRows.filter((c) => normalizeStatus(c.status) === activeFilter);
    if (!rows.length) {
        const li = document.createElement("li");
        li.className = "cand-card cand-card--empty";
        li.textContent =
            activeFilter === "all"
                ? "Aucune candidature de coiffeur pour le moment."
                : "Aucune candidature dans cette catégorie.";
        listEl.appendChild(li);
        return;
    }
    for (const c of rows) {
        listEl.appendChild(renderCandidatureCard(c));
    }
}

async function loadCoiffeurExtras(rows) {
    const uids = [...new Set(rows.map((r) => String(r.coiffeurUid || r.coiffeur?.id || "").trim()).filter(Boolean))];
    const entries = await Promise.all(
        uids.map(async (uid) => {
            const avis = await listAvisForPro(uid).catch(() => []);
            const summary = computeAvisSummary(avis);
            return [
                uid,
                {
                    avg: formatAvisAvg(summary.avg),
                    avisCount: summary.total
                }
            ];
        })
    );
    coiffeurExtras = Object.fromEntries(entries);
}

async function loadAll() {
    allRows = await listCandidaturesForSalon(myUid);
    allRows = allRows.filter((c) => isCoiffeurRole(c.coiffeur || {}));
    await loadCoiffeurExtras(allRows);
    updateStats();
    renderList();
}

async function handleRespond(id, status, confirmMsg) {
    if (!id || !myUid) return;
    if (!window.confirm(confirmMsg)) return;
    errEl.hidden = true;
    try {
        await respondCandidature(id, myUid, status);
        if (status === "accepted") {
            showToast("✓ Candidature acceptée");
        } else {
            showToast("Candidature refusée");
        }
        const keepModal = currentModalCandId && String(currentModalCandId) === String(id);
        await loadAll();
        if (keepModal) {
            const refreshed = allRows.find((row) => String(row.id) === String(id));
            if (refreshed) openMessageModal(refreshed);
        }
    } catch (e) {
        errEl.textContent = getFirebaseErrorMessage(e);
        errEl.hidden = false;
    }
}

if (filtersEl) {
    filtersEl.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-cand-filter]");
        if (!btn) return;
        activeFilter = btn.getAttribute("data-cand-filter") || "all";
        for (const tab of filtersEl.querySelectorAll(".jobs-tab")) {
            const on = tab === btn;
            tab.classList.toggle("is-active", on);
            tab.setAttribute("aria-selected", on ? "true" : "false");
        }
        renderList();
    });
}

function handleMessageOpen(id) {
    const c = allRows.find((row) => String(row.id) === String(id));
    if (c) openMessageModal(c);
}

listEl.addEventListener("click", (e) => {
    const messageBtn = e.target.closest("[data-cand-message]");
    if (messageBtn) {
        handleMessageOpen(messageBtn.getAttribute("data-cand-message"));
    }
});

if (messageModalEl) {
    messageModalEl.addEventListener("click", (e) => {
        if (e.target.closest("[data-cand-message-close]")) {
            closeMessageModal();
            return;
        }
        const acceptBtn = e.target.closest("[data-cand-accept]");
        const rejectBtn = e.target.closest("[data-cand-reject]");
        const reacceptBtn = e.target.closest("[data-cand-reaccept]");
        if (acceptBtn) {
            handleRespond(acceptBtn.getAttribute("data-cand-accept"), "accepted", "Confirmer : accepter cette candidature ?");
            return;
        }
        if (rejectBtn) {
            handleRespond(rejectBtn.getAttribute("data-cand-reject"), "rejected", "Confirmer : refuser cette candidature ?");
            return;
        }
        if (reacceptBtn) {
            handleRespond(
                reacceptBtn.getAttribute("data-cand-reaccept"),
                "accepted",
                "Réexaminer et accepter cette candidature ?"
            );
        }
    });
}

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && messageModalEl && !messageModalEl.hidden) {
        closeMessageModal();
    }
});

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    myUid = authUserId(user);
    let prof = null;
    try {
        prof = await fetchUserProfile(myUid);
    } catch (e) {
        errEl.textContent = getFirebaseErrorMessage(e);
        errEl.hidden = false;
        return;
    }
    const role = resolveUserRole(prof);
    if (role === "coiffeur") {
        if (inDashEmbed) {
            errEl.textContent = "Les candidatures reçues sont réservées aux salons.";
            errEl.hidden = false;
            return;
        }
        window.location.replace("dashboard.html");
        return;
    }
    if (role !== "salon") {
        errEl.textContent = "Cette page est réservée aux salons.";
        errEl.hidden = false;
        return;
    }
    try {
        await loadAll();
    } catch (e) {
        errEl.textContent = getFirebaseErrorMessage(e);
        errEl.hidden = false;
    }
});
</script>

</body>
</html>
