<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection… — HairConnect</title>
    <script>
        (function () {
            const id = new URLSearchParams(location.search).get("offre");
            if (id) {
                location.replace("offre-detail.html?offre=" + encodeURIComponent(id) + "#candidature");
            } else {
                location.replace("offres.html");
            }
        })();
    </script>
</head>
<body></body>
</html>
