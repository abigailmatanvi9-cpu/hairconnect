<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes favoris — HairConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page hc-theme-pro">

<div class="login-container subpage-container">
    <header class="login-header">
        <a href="dashboard.html" class="login-back" aria-label="Retour au tableau de bord">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
        </a>
        <h1 class="login-title">Mes favoris</h1>
    </header>

    <p id="err" class="form-error" role="alert" hidden></p>
    <div id="content" hidden>
        <p id="empty" class="form-info">Vous n'avez encore aucun favori.</p>
        <ul id="favoritesList" class="favorites-list"></ul>
    </div>
</div>

<script type="module">
import { auth, onAuthStateChanged, listFavorites, removeFavorite } from "./firebase.js";

const errEl = document.getElementById("err");
const content = document.getElementById("content");
const emptyEl = document.getElementById("empty");
const listEl = document.getElementById("favoritesList");

function renderFavorite(fav) {
    const li = document.createElement("li");
    li.className = "favorite-item";

    const link = document.createElement("a");
    link.href = `profil-public.html?uid=${encodeURIComponent(fav.proId)}`;
    link.className = "favorite-link";

    const name = document.createElement("span");
    name.className = "favorite-name";
    name.textContent = fav.pro.salonName || fav.pro.name || "Sans nom";

    const city = document.createElement("span");
    city.className = "favorite-city";
    city.textContent = fav.pro.city || "";

    const role = document.createElement("span");
    role.className = "favorite-role";
    role.textContent = fav.pro.role || "";

    link.appendChild(name);
    link.appendChild(city);
    link.appendChild(role);

    const removeBtn = document.createElement("button");
    removeBtn.className = "favorite-remove";
    removeBtn.textContent = "Retirer";
    removeBtn.onclick = async () => {
        try {
            await removeFavorite(auth.currentUser.uid, fav.proId);
            li.remove();
            if (listEl.children.length === 0) {
                emptyEl.hidden = false;
            }
        } catch (error) {
            alert("Erreur: " + error.message);
        }
    };

    li.appendChild(link);
    li.appendChild(removeBtn);

    return li;
}

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    try {
        const favorites = await listFavorites(user.uid);
        if (favorites.length === 0) {
            emptyEl.hidden = false;
        } else {
            favorites.forEach(fav => {
                listEl.appendChild(renderFavorite(fav));
            });
        }
        content.hidden = false;
    } catch (error) {
        errEl.textContent = "Erreur lors du chargement des favoris: " + error.message;
        errEl.hidden = false;
    }
});
</script>

</body>
</html>
