<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes rendez-vous &amp; paiement — HairConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page hc-theme-pro">

<div class="login-container subpage-container subpage-wide">
    <header class="login-header">
        <a href="dashboard.html" class="login-back" aria-label="Retour au tableau de bord">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
        </a>
        <h1 class="login-title">Mes rendez-vous &amp; paiement</h1>
    </header>

    <p id="gateErr" class="form-error agenda-pro__gate" role="status" hidden></p>

    <section id="mainSection" class="mes-rdv-client" hidden>
        <p class="mes-rdv-client__lead">
            Consultez vos rendez-vous et sélectionnez les articles marketplace pour votre prestation.
        </p>

        <p id="listErr" class="form-error" role="alert" hidden></p>
        <p id="listLoad" class="agenda-pro__loading">Chargement…</p>
        <ul id="rdvList" class="mes-rdv-client__list"></ul>
    </section>
</div>

<script type="module">
import {
    auth,
    onAuthStateChanged,
    fetchUserProfile,
    listRendezVousForClient,
    getFirebaseErrorMessage
} from "./firebase.js";

const fmt = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
const STATUS_LABELS = {
    planned: "À venir",
    completed: "Terminé",
    cancelled: "Annulé",
    noshow: "Absent"
};

function proLabel(p) {
    if (!p) return "Professionnel";
    const s = String(p.salonName || "").trim();
    if (s) return s;
    const n = String(p.name || "").trim();
    if (n) return n;
    return String(p.email || "Professionnel");
}

function escapeHtml(s) {
    return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function formatWhen(iso) {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "—";
    return d.toLocaleString("fr-FR", {
        weekday: "short",
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

let myUid = null;
let refreshTimer = null;

function marketplaceSelectionUrl(r) {
    const params = new URLSearchParams({
        sellerUid: String(r.proUid || "").trim(),
        rdvId: String(r.id || "").trim(),
        return: "mes-rdv-client.html"
    });
    return `marketplace.html?${params.toString()}`;
}

function renderCard(r) {
    const li = document.createElement("li");
    li.className = "mes-rdv-client__card";
    const pro = r.pro || {};
    const price = r.priceFcfa != null ? Number(r.priceFcfa) : null;
    const prestPrice = r.prestationPriceFcfa != null ? Number(r.prestationPriceFcfa) : null;
    const rdvStatus = String(r.status || "planned").toLowerCase();
    const statusLabel = STATUS_LABELS[rdvStatus] || rdvStatus;
    const summary = r.itemSelectionSummary || { itemsCount: 0, itemsSubtotalFcfa: 0 };
    const itemsSubtotal = Number(summary.itemsSubtotalFcfa || 0);
    const computedTotal = (prestPrice != null ? prestPrice : 0) + itemsSubtotal;

    const head = document.createElement("div");
    head.className = "mes-rdv-client__card-head";
    head.innerHTML =
        "<h2 class=\"mes-rdv-client__pro\">" +
        escapeHtml(proLabel(pro)) +
        "</h2>" +
        "<p class=\"mes-rdv-client__when\">" +
        escapeHtml(formatWhen(r.scheduledAt)) +
        "</p>";

    const prest = document.createElement("p");
    prest.className = "mes-rdv-client__prest";
    prest.innerHTML =
        "<span class=\"agenda-pro__k\">Prestation</span><br>" + escapeHtml(r.prestation || "—");

    const statusLine = document.createElement("p");
    statusLine.className = "mes-rdv-client__statusline";
    statusLine.innerHTML =
        "<span class=\"agenda-pro__k\">Statut</span><br>" +
        "<span class=\"agenda-pro__status agenda-pro__status--" +
        escapeHtml(rdvStatus) +
        "\">" +
        escapeHtml(statusLabel) +
        "</span>";

    const selectSummary = document.createElement("p");
    selectSummary.className = "mes-rdv-client__select-summary";
    selectSummary.innerHTML =
        "<span class=\"agenda-pro__k\">Articles marketplace</span><br>" +
        escapeHtml(String(summary.itemsCount || 0)) +
        " article(s) · Sous-total <strong>" +
        escapeHtml(fmt.format(itemsSubtotal)) +
        " FCFA</strong>";

    const infoRow = document.createElement("div");
    infoRow.className = "mes-rdv-client__pay";
    const showTotal =
        price != null && price > 0
            ? price
            : prestPrice != null || itemsSubtotal > 0
              ? computedTotal
              : null;
    if (prestPrice != null || itemsSubtotal > 0 || (showTotal != null && showTotal > 0)) {
        let breakdown =
            "<div class=\"mes-rdv-client__price-breakdown\">";
        if (prestPrice != null) {
            breakdown +=
                "<p class=\"mes-rdv-client__price-line\">Prestation : <strong>" +
                fmt.format(prestPrice) +
                " FCFA</strong></p>";
        }
        if (itemsSubtotal > 0) {
            breakdown +=
                "<p class=\"mes-rdv-client__price-line\">Articles : <strong>" +
                fmt.format(itemsSubtotal) +
                " FCFA</strong></p>";
        }
        if (showTotal != null && showTotal > 0) {
            breakdown +=
                "<p class=\"mes-rdv-client__price\">Total : <strong>" +
                fmt.format(showTotal) +
                " FCFA</strong></p>";
        } else if (prestPrice == null && itemsSubtotal > 0) {
            breakdown +=
                "<p class=\"mes-rdv-client__noprice\">Le professionnel n’a pas encore indiqué le prix de la prestation.</p>";
        }
        breakdown += "</div>";
        infoRow.innerHTML = breakdown;
    } else {
        infoRow.innerHTML =
            "<p class=\"mes-rdv-client__noprice\">Le professionnel n’a pas encore indiqué de montant pour ce rendez-vous.</p>";
    }

    const selectionAction = document.createElement("div");
    selectionAction.className = "mes-rdv-client__selection-action";
    if (rdvStatus === "planned") {
        const marketLink = document.createElement("a");
        marketLink.className = "register-submit mes-rdv-client__select-btn";
        marketLink.href = marketplaceSelectionUrl(r);
        marketLink.textContent = "Choisir des articles marketplace";
        selectionAction.appendChild(marketLink);
    } else {
        const lockedNote = document.createElement("p");
        lockedNote.className = "mes-rdv-client__select-locked";
        lockedNote.textContent =
            rdvStatus === "completed"
                ? "Prestation terminée : achat d’articles impossible pour ce rendez-vous."
                : "Achat d’articles impossible pour ce rendez-vous (statut : " + statusLabel + ").";
        selectionAction.appendChild(lockedNote);
    }

    li.appendChild(head);
    li.appendChild(prest);
    li.appendChild(statusLine);
    li.appendChild(selectSummary);
    li.appendChild(infoRow);
    li.appendChild(selectionAction);

    return li;
}

async function loadList() {
    const listEl = document.getElementById("rdvList");
    const loadEl = document.getElementById("listLoad");
    const errEl = document.getElementById("listErr");
    if (!listEl || !myUid) return;
    if (errEl) {
        errEl.hidden = true;
        errEl.textContent = "";
    }
    if (loadEl) loadEl.hidden = false;
    listEl.innerHTML = "";
    try {
        const rows = await listRendezVousForClient(myUid);
        if (loadEl) loadEl.hidden = true;
        if (!rows.length) {
            const li = document.createElement("li");
            li.className = "mes-rdv-client__empty";
            li.textContent = "Aucun rendez-vous pour le moment.";
            listEl.appendChild(li);
            return;
        }
        for (const r of rows) {
            listEl.appendChild(renderCard(r));
        }
    } catch (e) {
        if (loadEl) loadEl.hidden = true;
        if (errEl) {
            errEl.textContent = getFirebaseErrorMessage(e);
            errEl.hidden = false;
        }
    }
}

onAuthStateChanged(auth, async (user) => {
    const gate = document.getElementById("gateErr");
    const section = document.getElementById("mainSection");
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    myUid = user.uid;
    const profile = await fetchUserProfile(user.uid);
    const role = String(profile?.role || "").trim().toLowerCase();
    if (!profile || role !== "client") {
        if (gate) {
            gate.textContent =
                "Cette page est réservée aux clients. Les professionnels gèrent les rendez-vous depuis « Agenda & RDV ».";
            gate.hidden = false;
        }
        if (section) section.hidden = true;
        return;
    }
    if (gate) gate.hidden = true;
    if (section) section.hidden = false;
    await loadList();
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
        loadList().catch(() => {});
    }, 10000);
});

window.addEventListener("beforeunload", () => {
    if (refreshTimer) clearInterval(refreshTimer);
});
</script>
</body>
</html>
