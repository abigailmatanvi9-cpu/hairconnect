<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HairConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="hc-marketing hc-marketing--beauty">

<div class="marketing-hero">
    <img
        class="marketing-hero__img"
        src="images/login-hero.png"
        alt="Intérieur de salon de coiffure"
        width="1200"
        height="640"
        loading="eager"
        decoding="async"
    >
</div>

<div class="marketing-sheet">
    <div class="marketing-blobs" aria-hidden="true">
        <span class="marketing-blobs__c marketing-blobs__c--1"></span>
        <span class="marketing-blobs__c marketing-blobs__c--2"></span>
        <span class="marketing-blobs__c marketing-blobs__c--3"></span>
    </div>

    <p class="marketing-greeting">BONJOUR !</p>
    <p class="marketing-tagline">Trouvez les meilleures prestations coiffure près de chez vous.</p>
    <p class="marketing-brand">HairConnect</p>
    <p class="marketing-description">
        Connectez-vous avec des coiffeurs talentueux et des salons près de chez vous.
    </p>

    <div class="marketing-actions">
        <a href="login.html" class="btn primary marketing-btn">SE CONNECTER</a>
        <a href="register.html" class="btn secondary marketing-btn">CRÉER UN COMPTE</a>
    </div>

    <p class="footer marketing-footer">
        En continuant, vous acceptez nos Conditions d'utilisation et notre Politique de confidentialité
    </p>
</div>

</body>
</html>
